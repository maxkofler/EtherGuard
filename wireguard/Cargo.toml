[package]
name = "wireguard"
version = "0.1.0"
edition = "2024"

[dependencies]
zerocopy = { version = "^0.8", default-features = false, features = ["derive"] }
zeroize = { version = "1.9.1", default-features = false, features = ["zeroize_derive"] }
rand = "^0.10"

# Cryptography
generic-array = { version = "^1.4", default-features = false }
chacha20poly1305 = { version = "^0.11", default-features = true }
blake2 = { version = "^0.11", default-features = false }
hmac = { version = "^0.13", default-features = false }
subtle = { version = "^2.6", default-features = false }
x25519-dalek = {version = "^3.0", default-features = false, features = ["static_secrets", "zeroize"] }
